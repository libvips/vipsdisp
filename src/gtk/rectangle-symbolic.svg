<svg
        xmlns='http://www.w3.org/2000/svg'
        xmlns:svg='http://www.w3.org/2000/svg'
        color='rgb(0,0,0)'
        fill='none'
        stroke='rgb(0,0,0)'
        stroke-width='1'
        stroke-linecap='square'
        stroke-linejoin='miter'
        width='800px'
        height='800px'
        viewBox='0 0 24 24'
        class='transparent-fill'>
  <rect
          fill='none'
          fill-rule='nonzero'
          stroke='url(#gpa:foreground) rgb(0,0,0)'
          stroke-opacity='1'
          stroke-width='1'
          stroke-linecap='butt'
          stroke-linejoin='miter'
          stroke-miterlimit='4'
          x='3'
          y='3'
          width='18'
          height='18'
          gpa:stroke-minwidth='0.25'
          gpa:stroke-maxwidth='1.5'
          class='transparent-fill foreground-stroke'>
  </rect>
</svg>
